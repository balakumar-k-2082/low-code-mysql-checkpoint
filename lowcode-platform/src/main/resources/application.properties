# Server Configuration
server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/lowcode_system?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.lowcode=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Checkpoint System Configuration
checkpoint.mysql.host=localhost
checkpoint.mysql.port=3306
checkpoint.mysql.user=root
checkpoint.mysql.password=
checkpoint.enabled=true

# CORS Configuration (for React frontend)
cors.allowed.origins=http://localhost:3000,http://localhost:5173
